# This is a basic workflow to type check with Actions

name: Type check

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "develop" , "main" ]
  pull_request:
    branches: [ "develop" , "main" ]

  # # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "type-check"
  type-check:
    name: Run typescript compiler with no js file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install deps
        run: npm ci

      - name: Run TS type-check
        run: npm run type-check

      - name: Trigger Netlify build
        env: 
          NETLIFY_HOOK: ${{secrets.NETLIFY_BUILD_HOOK}}
        run: |
          curl -X POST -d '{}' "$NETLIFY_HOOK"
          
  
